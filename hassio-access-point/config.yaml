---
name: Hass.io Access Point
version: 0.6.13
slug: hassio-access-point
description: Create a WiFi access point to directly connect devices to Home Assistant
arch: [armhf, armv7, aarch64, amd64, i386]
url: https://github.com/DrakeCaesar/Hassio-Access-Point
startup: system
boot: auto
host_network: true
apparmor: true
host_dbus: true
privileged:
  - NET_ADMIN
init: false
options:
  general:
    interface_2_4ghz: "wlp1s0u1u4"
    interface_5ghz: "wlan0"
    country_code: ""
    address: 192.168.99.1
    netmask: 255.255.255.0
    broadcast: 192.168.99.255
    dhcp: false
    dhcp_start_addr: 192.168.99.10
    dhcp_end_addr: 192.168.99.20
    allow_mac_addresses: []
    deny_mac_addresses: []
    client_internet_access: false
    client_dns_override: []
    debug: 0
    hostapd_config_override: []
    dnsmasq_config_override: []
  band_2_4ghz:
    ssid: ""
    wpa_passphrase: ""
    hide_ssid: false
    channel: 6
    ht_capab: ""
  band_5ghz:
    ssid: ""
    wpa_passphrase: ""
    hide_ssid: false
    channel: 44
    ht_capab: ""
    ieee80211ac: true
    vht_capab: ""
    dfs: false
schema:
  general:
    interface_2_4ghz: str?
    interface_5ghz: str?
    country_code: str?
    address: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
    netmask: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
    broadcast: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
    dhcp: bool
    dhcp_start_addr: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
    dhcp_end_addr: match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
    allow_mac_addresses:
      - match(^([0-9a-fA-F]{2}:){4}[0-9a-fA-F]{2})?
    deny_mac_addresses:
      - match(^([0-9a-fA-F]{2}:){4}[0-9a-fA-F]{2})?
    client_internet_access: bool
    client_dns_override:
      - match(^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$)
    debug: int(0,2)
    hostapd_config_override:
      - str?
    dnsmasq_config_override:
      - str?
  band_2_4ghz:
    ssid: str?
    wpa_passphrase: password?
    hide_ssid: bool
    channel: int(1,13)
    ht_capab: list(|[SHORT-GI-20]|[SHORT-GI-20][DSSS_CCK-40]|[HT40+][SHORT-GI-20][SHORT-GI-40]|[HT40-][SHORT-GI-20][SHORT-GI-40]|[HT40+][SHORT-GI-20][DSSS_CCK-40]|[HT40-][SHORT-GI-20][DSSS_CCK-40])
  band_5ghz:
    ssid: str?
    wpa_passphrase: password?
    hide_ssid: bool
    channel: int(1,196)
    ht_capab: list(|[SHORT-GI-20]|[HT40+][SHORT-GI-20]|[HT40-][SHORT-GI-20]|[HT40+][SHORT-GI-20][SHORT-GI-40]|[HT40-][SHORT-GI-20][SHORT-GI-40])
    ieee80211ac: bool
    vht_capab: list(|[SHORT-GI-80]|[SHORT-GI-80][HTC-VHT]|[SHORT-GI-80][RXLDPC]|[SHORT-GI-80][RXLDPC][MAX-MPDU-11454]|[MAX-MPDU-11454])
    dfs: bool
